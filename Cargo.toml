[package]
name = "tutad"
description = "Daemon that turns a Tuta mailbox into a Maildir and Tuta submissions into mail"
authors = ["Paul Chambaz <paul.chambaz@tutanota.com>"]
homepage = "https://github.com/paulchambaz/tutad"
version = "0.1.0"
edition = "2021"
include = ["/src/**/*", "/tutad.1.scd", "/README.md", "/LICENSE"]
license = "GPL-3.0-only"
readme = "README.md"
documentation = "https://docs.rs/tutad"
repository = "https://github.com/paulchambaz/tutad"
keywords = ["tuta", "tutanota", "maildir", "email", "daemon"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
crypto-primitives = { path = "sdk/generated/tuta-sdk/rust/crypto-primitives" }
data-encoding = "2.11.1"
directories = "6.0.0"
form_urlencoded = "1.2.2"
futures = "0.3.34"
hmac = "0.13.0"
log = "0.4.35"
rand_core = { version = "0.6.4", features = ["getrandom"] }
mail-parser = "1.0.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1.1.8"
tuta-sdk = { version = "362.261020.0", path = "sdk/generated/tuta-sdk/rust/sdk", features = ["net"] }

[[bin]]
name = "tutad"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tuta-sdk = { path = "sdk/generated/tuta-sdk/rust/sdk", features = ["testing"] }
